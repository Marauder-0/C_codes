<!DOCTYPE html>

<body align="center">
    <h1>Image Display and Font Styling</h1>

    <!-- First Image and Name -->

        <img src="scenery.jpg" alt="Scenery." width="300" height="200">
        <br><br>
        <font size="5" color="red" face="Verdana" style="text-decoration: underline;"><b><u>Scenery</u></b></font>

    <br>

    <!-- Second Image and Name -->
    <div>
        <img src="sunflower.jpg" alt="Sunflower" width="300" height="200">
        <br><br>
        <font size="5" color="purple" face="Verdana" style="text-decoration: underline;"><b><u>Sunflower</u></b></font>
    </div>
</body>

</html>
